<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Letreiro Bem Vindos</title>
    <script src="/_sdk/element_sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', 'Chalkboard', cursive;
        }

        .container {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Confetes decorativos */
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            animation: confetti-fall linear infinite;
            opacity: 0.8;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100%) rotate(0deg);
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        /* Estrelas decorativas */
        .star {
            position: absolute;
            font-size: 24px;
            animation: twinkle 1.5s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Balões */
        .balloon {
            position: absolute;
            font-size: 40px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Área do letreiro */
        .marquee-wrapper {
            position: relative;
            width: 95%;
            max-width: 2400px;
            padding: 20px;
        }

        .marquee-frame {
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff, #5f27cd);
            background-size: 300% 300%;
            animation: gradient-shift 4s ease infinite;
            border-radius: 30px;
            padding: 8px;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.3),
                0 0 60px rgba(255, 255, 255, 0.3),
                inset 0 0 30px rgba(255, 255, 255, 0.2);
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .marquee {
            width: 100%;
            height: 350px;
            overflow: hidden;
            border-radius: 22px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            position: relative;
        }

        /* Luzes de cabaré na borda */
        .lights-top, .lights-bottom {
            position: absolute;
            left: 0;
            right: 0;
            height: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .lights-top { top: 0; }
        .lights-bottom { bottom: 0; }

        .light-bulb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            animation: blink 0.8s ease-in-out infinite;
        }

        .light-bulb:nth-child(odd) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 100% { 
                box-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 30px currentColor;
                opacity: 1;
            }
            50% { 
                box-shadow: 0 0 5px currentColor;
                opacity: 0.5;
            }
        }

        /* Faixa animada */
        .track {
            display: flex;
            align-items: center;
            gap: 30px;
            height: 100%;
            padding: 0 20px;
            animation: scroll 60s linear infinite;
        }

        /* Letras */
        .track img {
            height: 240px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .space {
            width: 60px;
            flex-shrink: 0;
        }

        /* Animação do letreiro - scroll ainda mais rápido em 60 segundos */
        @keyframes scroll {
            0% {
                transform: translateX(100vw);
            }
            100% {
                transform: translateX(-3800px);
            }
        }

        /* Título decorativo */
        .title-decoration {
            position: absolute;
            top: 15px;
            display: flex;
            gap: 10px;
            font-size: 28px;
        }

        .title-decoration span {
            animation: bounce 0.6s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Nuvens decorativas */
        .cloud {
            position: absolute;
            font-size: 50px;
            opacity: 0.3;
            animation: cloud-float 20s linear infinite;
        }

        @keyframes cloud-float {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }
    </style>
</head>
